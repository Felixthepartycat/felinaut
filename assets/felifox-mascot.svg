<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" fill="none">
  <title>Felifox — a little trouble, a lot of spark</title>
  <desc>Original Felifox artwork: a midnight-purple cat with one golden eye and a wink hugs a flaming, multicolored yarn ball. A sweeping orbit and scattered sparks frame the transparent illustration.</desc>
  <defs>
    <linearGradient id="fur" x1="145" y1="87" x2="311" y2="353" gradientUnits="userSpaceOnUse">
      <stop stop-color="#30204F"/><stop offset=".48" stop-color="#181027"/><stop offset="1" stop-color="#260D43"/>
    </linearGradient>
    <linearGradient id="ear" x1="160" y1="87" x2="214" y2="165" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF859F"/><stop offset="1" stop-color="#ED268C"/>
    </linearGradient>
    <linearGradient id="fire" x1="411" y1="98" x2="336" y2="306" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4794"/><stop offset=".45" stop-color="#FF8732"/><stop offset=".78" stop-color="#FFCF38"/><stop offset="1" stop-color="#FFF29A"/>
    </linearGradient>
    <linearGradient id="yarn" x1="302" y1="204" x2="408" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD84D"/><stop offset=".28" stop-color="#FF8140"/><stop offset=".55" stop-color="#FF309D"/><stop offset=".8" stop-color="#AB38F5"/><stop offset="1" stop-color="#4935BE"/>
    </linearGradient>
    <linearGradient id="coolYarn" x1="419" y1="267" x2="354" y2="383" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75FFF0"/><stop offset=".48" stop-color="#13CFE8"/><stop offset="1" stop-color="#7160FF"/>
    </linearGradient>
    <linearGradient id="orbit" x1="91" y1="337" x2="495" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9D37F4"/><stop offset=".3" stop-color="#FF2EA8"/><stop offset=".66" stop-color="#FF8B38"/><stop offset="1" stop-color="#FFE968"/>
    </linearGradient>
    <linearGradient id="eye" x1="268" y1="140" x2="285" y2="197" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF5AD"/><stop offset=".48" stop-color="#FFE24D"/><stop offset="1" stop-color="#FFAC24"/>
    </linearGradient>
    <clipPath id="ballClip"><circle cx="348" cy="285" r="94"/></clipPath>
  </defs>

