<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <title>Felifox flaming yarn symbol</title>
  <desc>Original Felifox small-size mark: three curved yarn strands, an aqua selvedge, a pink and amber flame, and a golden orbital sweep on transparency.</desc>
  <defs>
    <linearGradient id="flame" x1="44" y1="3" x2="32" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4294"/><stop offset=".52" stop-color="#FF853C"/><stop offset="1" stop-color="#FFE466"/>
    </linearGradient>
    <linearGradient id="wool" x1="22" y1="23" x2="42" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFCD48"/><stop offset=".4" stop-color="#FF6086"/><stop offset=".7" stop-color="#EF2DA9"/><stop offset="1" stop-color="#8B42EB"/>
    </linearGradient>
    <linearGradient id="ring" x1="5" y1="51" x2="58" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF369F"/><stop offset=".5" stop-color="#FF9F38"/><stop offset="1" stop-color="#FFE979"/>
    </linearGradient>
    <clipPath id="woolClip"><circle cx="31" cy="39" r="19"/></clipPath>
  </defs>
  <!-- Large flame tongues survive reduction; there are no hairline details. -->
  <path d="M26 30C21 22 27 16 32 13C30 20 35 22 38 17C42 12 42 7 40 3C50 7 54 14 51 22C50 25 50 27 52 28C55 27 57 24 58 22C61 34 53 42 45 44L26 40Z" fill="url(#flame)" stroke="#241039" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M36 29C34 24 42 20 44 15C47 22 42 26 44 30C46 32 49 31 51 29C50 36 45 39 40 39Z" fill="#FFE66B"/>
  <circle cx="31" cy="39" r="20.5" fill="#241039"/>
  <g clip-path="url(#woolClip)">
    <circle cx="31" cy="39" r="19" fill="url(#wool)"/>
    <path d="M44 24C53 38 45 54 31 59H54V28Z" fill="#24DCE9"/>
    <g stroke="#61205C" stroke-width="2.8" stroke-linecap="round">
      <path d="M11 29C20 26 29 30 36 36M11 38C18 35 24 38 29 42"/>
      <path d="M15 54C29 47 39 36 40 20M26 59C38 52 47 42 49 31"/>
    </g>
  </g>
  <circle cx="31" cy="39" r="19.5" stroke="#241039" stroke-width="2.5"/>
  <!-- Open ends keep the orbit light and the ball's silhouette recognizable. -->
  <path d="M10 40C1 50 12 53 28 49C41 46 54 39 58 34C63 42 43 52 28 56C8 61-2 51 10 40Z" fill="url(#ring)"/>
  <path d="M12 12L14 17L19 19L14 21L12 26L10 21L5 19L10 17Z" fill="#FFCE43"/>
</svg>
